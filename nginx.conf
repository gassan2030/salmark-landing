server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    # один адрес для поиска: www → без www
    if ($host = www.salmark.kz) { return 301 https://salmark.kz$request_uri; }

    # страницы приложений (App Store, Google Play) остаются по старым адресам: /app/ и /app/privacy/
    location = /terms    { return 301 /app/; }
    location = /terms/   { return 301 /app/; }
    location = /privacy  { return 301 /privacy/; }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 500;

    # expires, а не add_header: иначе заголовки безопасности ниже пропадают в location
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~* \.(jpg|jpeg|png|gif|svg|webp|avif|ico|woff2?)$ {
        access_log off;
        expires 30d;
    }
    location ~* \.(css|js)$ {
        expires 7d;
    }
    location = /sitemap.xml { expires 1d; }
    location = /robots.txt  { expires 1d; }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # настоящий 404 вместо главной на любой адрес — иначе поисковики видят дубли
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
        expires 5m;
    }
}
