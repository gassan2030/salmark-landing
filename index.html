<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#111111" />

<title>Salmark</title>
<meta name="description" content="Сайт в разработке." />
<meta name="robots" content="noindex, nofollow" />
<link rel="canonical" href="https://salmark.kz/" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23111111'/%3E%3Ctext x='50' y='70' font-size='58' font-weight='400' font-style='italic' text-anchor='middle' fill='%23c2410c' font-family='Georgia, serif'%3ES%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23111111'/%3E%3Ctext x='50' y='70' font-size='58' font-weight='400' font-style='italic' text-anchor='middle' fill='%23c2410c' font-family='Georgia, serif'%3ES%3C/text%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" />

<style>
  :root {
    --ink: #111111;
    --paper: #f5f2ec;
    --muted: #8b857a;
    --rule: #2a2a2a;
    --accent: #c2410c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--ink);
    color: var(--paper);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  main {
    width: 100%;
    max-width: 480px;
    text-align: center;
  }

  .mark {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 56px;
    line-height: 1;
    color: var(--accent);
  }

  h1 {
    margin-top: 28px;
    font-family: "Instrument Serif", Georgia, serif;
    font-weight: 400;
    font-size: clamp(28px, 7vw, 40px);
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  .rule {
    width: 48px;
    height: 1px;
    margin: 28px auto;
    background: var(--rule);
  }

  p {
    font-size: 15px;
    line-height: 1.6;
    color: var(--muted);
  }
</style>
</head>
<body>
  <main>
    <div class="mark">S</div>
    <h1>Сайт в разработке</h1>
    <div class="rule"></div>
    <p>Скоро здесь будет новая версия.</p>
  </main>
</body>
</html>
